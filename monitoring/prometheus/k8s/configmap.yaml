apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            replacement: ${1}:${2}
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
            replacement: $1

      - job_name: aiops-services
        static_configs:
          - targets:
              - frontend.aiops.svc:80
              - api.aiops.svc:80

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alert-rules.yml: |
    groups:
      - name: aiops.rules
        rules:
          - alert: AppDown
            expr: up{job="aiops-services"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "App {{ $labels.instance }} is down"
              description: "The target {{ $labels.instance }} has been down for more than 1 minute."

          - alert: PodOOMKilled
            expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} restarted (possible OOMKilled)"
              description: |
                Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted
                within the last 5m. Check logs for OOMKilled.

          - alert: HighMemoryUsage
            expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"
              description: "Memory usage is above 85% of the limit for {{ $labels.pod }}."

          - alert: CrashLoop
            expr: rate(kube_pod_container_status_restarts_total[10m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "CrashLoopBackOff on {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} is crash looping."
