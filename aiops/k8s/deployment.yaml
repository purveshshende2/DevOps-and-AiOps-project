apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-assistant
  namespace: aiops
  labels:
    app: aiops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-assistant
  template:
    metadata:
      labels:
        app: aiops-assistant
    spec:
      serviceAccountName: aiops-assistant
      containers:
        - name: aiops-assistant
          image: ghcr.io/demo/aiops-app-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: "mock"
            - name: LLM_BASE_URL
              value: "http://localhost:11434"
            - name: LLM_MODEL
              value: "llama3.2"
            - name: LOKI_URL
              value: "http://loki.monitoring.svc:3100"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: github-token
            - name: GITHUB_REPO
              value: "<YOUR_GITHUB_USERNAME>/aiops-project"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
